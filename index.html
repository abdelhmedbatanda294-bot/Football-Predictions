
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>توقعات المباريات</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    .card {
      background: #1e293b;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 15px;
    }

    input,
    select {
      background: #334155;
      color: white;
    }

    button {
      background: #0284c7;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0369a1;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .logout {
      background: #b91c1c;
      width: auto;
      padding: 10px 18px;
    }

    .match {
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      text-align: center;
      margin-bottom: 18px;
    }

    .team {
      font-weight: bold;
      font-size: 17px;
    }

    .vs {
      color: #38bdf8;
      font-weight: bold;
    }

    .scores {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .double-box {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #facc15;
      margin-top: 8px;
      cursor: pointer;
    }

    .double-box input {
      width: auto;
      margin: 0;
      cursor: pointer;
    }

    .double-warning {
      color: #f87171;
      font-size: 13px;
      margin-top: 5px;
      display: none;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-top: 15px;
    }

    .success {
      background: #166534;
    }

    .error {
      background: #991b1b;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #475569;
    }

    th {
      color: #38bdf8;
    }

    .first-place {
      color: #facc15;
      font-weight: bold;
    }

    .refresh {
      background: #475569;
    }

    .loading {
      text-align: center;
      color: #cbd5e1;
      padding: 20px;
    }

    .no-matches {
      text-align: center;
      color: #94a3b8;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .teams {
        grid-template-columns: 1fr;
      }

      .vs {
        display: none;
      }

      .scores {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <button class="logout" onclick="logout()">
    تسجيل الخروج
  </button>

  <h1>⚽ توقعات مباريات كرة القدم</h1>

  <p class="subtitle">
    توقع النتائج وتابع ترتيب المتسابقين
  </p>

  <div class="card">

    <h2>بيانات المتسابق</h2>
    <br>

    <label for="playerName">اسم المتسابق</label>

    <input
      id="playerName"
      type="text"
      placeholder="اسمك"
    >

    <label for="favoriteTeam">الفريق المفضل</label>

    <input
      id="favoriteTeam"
      type="text"
      placeholder="فريقك المفضل"
    >

  </div>

  <div class="card">

    <h2>⚽ المباريات</h2>
    <br>

    <div id="matchesContainer">
      <div class="loading">
        جاري تحميل المباريات...
      </div>
    </div>

    <button id="saveButton" onclick="submitAllPredictions()">
      💾 حفظ كل التوقعات
    </button>

    <div id="message" class="message"></div>

  </div>

  <div class="card">

    <h2>🏆 ترتيب المتسابقين</h2>
    <br>

    <button class="refresh" onclick="loadLeaderboard()">
      🔄 تحديث الترتيب الآن
    </button>

    <div id="leaderboardContainer">
      <div class="loading">
        جاري تحميل الترتيب...
      </div>
    </div>

  </div>

</div>

<script>

/* =====================================================
   API
===================================================== */

// تم تعديل الرابط: بدون ?action=matches
const API_URL =
  "https://script.google.com/macros/s/AKfycbw_DCKr89kd30z5h6qgPO-rauUCaaUg0ZJKZxIkLbjEQ7gyojC5tW267iY01W6_t-w/exec";


let matches = [];


/* =====================================================
   CHECK USER
===================================================== */

const userType = localStorage.getItem("userType");

if (userType !== "player") {
  window.location.href = "login.html";
}


/* =====================================================
   PLAYER DATA
===================================================== */

document.getElementById("playerName").value =
  localStorage.getItem("playerName") || "";

document.getElementById("favoriteTeam").value =
  localStorage.getItem("favoriteTeam") || "";


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =====================================================
   LOAD MATCHES
===================================================== */

async function loadMatches() {

  const container =
    document.getElementById("matchesContainer");

  container.innerHTML =
    '<div class="loading">جاري تحميل المباريات...</div>';

  try {

    const response = await fetch(
      `${API_URL}?action=matches&t=${Date.now()}`,
      {
        method: "GET",
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error("HTTP Error: " + response.status);
    }

    const data = await response.json();

    console.log("MATCHES FROM SERVER:", data);

    if (!data.success) {
      throw new Error(
        data.message || "فشل تحميل المباريات"
      );
    }

    matches = Array.isArray(data.matches)
      ? data.matches
      : [];

    renderMatches();

  } catch (error) {

    console.error("LOAD MATCHES ERROR:", error);

    container.innerHTML = `
      <div class="no-matches">
        ❌ حدث خطأ أثناء تحميل المباريات
        <br><br>
        حاول تحديث الصفحة
      </div>
    `;
  }
}


/* =====================================================
   RENDER MATCHES
===================================================== */

function renderMatches() {

  const container =
    document.getElementById("matchesContainer");

  if (!matches.length) {

    container.innerHTML = `
      <div class="no-matches">
        لا توجد مباريات حاليًا
      </div>
    `;

    return;
  }

  container.innerHTML = "";

  matches.forEach(match => {

    const matchId = String(match.matchId);

    const safeId = matchId.replace(
      /[^a-zA-Z0-9_-]/g,
      "_"
    );

    const matchElement = document.createElement("div");

    matchElement.className = "match";

    matchElement.innerHTML = `

      <div class="teams">

        <div class="team">
          ${escapeHtml(match.homeTeam)}
        </div>

        <div class="vs">
          VS
        </div>

        <div class="team">
          ${escapeHtml(match.awayTeam)}
        </div>

      </div>

      <div class="scores">

        <div>

          <label>
            أهداف ${escapeHtml(match.homeTeam)}
          </label>

          <input
            type="number"
            min="0"
            max="99"
            id="home-${safeId}"
            placeholder="0"
          >

        </div>

        <div>

          <label>
            أهداف ${escapeHtml(match.awayTeam)}
          </label>

          <input
            type="number"
            min="0"
            max="99"
            id="away-${safeId}"
            placeholder="0"
          >

        </div>

      </div>

      <label class="double-box">

        <input
          type="checkbox"
          class="double-checkbox"
          data-match-id="${escapeHtml(matchId)}"
          id="double-${safeId}"
          onchange="handleDoubleSelection(this)"
        >

        مباراة Double ×2

      </label>

      <div
        class="double-warning"
        id="warning-${safeId}">

        ⚠️ مسموح بـ Double واحد فقط

      </div>

    `;

    container.appendChild(matchElement);

  });
}


/* =====================================================
   DOUBLE SELECTION
===================================================== */

function handleDoubleSelection(selectedCheckbox) {

  const allDoubleCheckboxes =
    document.querySelectorAll(".double-checkbox");

  if (!selectedCheckbox.checked) {
    return;
  }

  allDoubleCheckboxes.forEach(checkbox => {

    if (checkbox !== selectedCheckbox) {
      checkbox.checked = false;
    }

  });
}


/* =====================================================
   GET SELECTED DOUBLE
===================================================== */

function getSelectedDoubleMatchId() {

  const selected =
    document.querySelector(".double-checkbox:checked");

  if (!selected) {
    return null;
  }

  return String(selected.dataset.matchId);
}


/* =====================================================
   SUBMIT ALL PREDICTIONS
===================================================== */

async function submitAllPredictions() {

  const playerName =
    document.getElementById("playerName").value.trim();

  const favoriteTeam =
    document.getElementById("favoriteTeam").value.trim();

  if (!playerName) {

    showMessage("اكتب اسمك أولًا", false);

    return;
  }

  localStorage.setItem("playerName", playerName);

  localStorage.setItem("favoriteTeam", favoriteTeam);

  let playerId = localStorage.getItem("playerId");

  if (!playerId) {

    playerId =
      playerName.toLowerCase().replace(/\s+/g, "-") +
      "-" +
      Date.now();

    localStorage.setItem("playerId", playerId);
  }

  const doubleCheckboxes =
    document.querySelectorAll(".double-checkbox:checked");

  if (doubleCheckboxes.length > 1) {

    showMessage(
      "❌ مسموح بـ Double واحد فقط",
      false
    );

    return;
  }

  const selectedDoubleId =
    getSelectedDoubleMatchId();

  let savedCount = 0;

  let errors = [];

  const saveButton =
    document.getElementById("saveButton");

  saveButton.disabled = true;

  saveButton.textContent = "⏳ جاري حفظ التوقعات...";

  for (const match of matches) {

    const matchId = String(match.matchId);

    const safeId = matchId.replace(
      /[^a-zA-Z0-9_-]/g,
      "_"
    );

    const homeInput =
      document.getElementById(`home-${safeId}`);

    const awayInput =
      document.getElementById(`away-${safeId}`);

    const doubleInput =
      document.getElementById(`double-${safeId}`);

    if (!homeInput || !awayInput || !doubleInput) {
      continue;
    }

    if (
      homeInput.value === "" ||
      awayInput.value === ""
    ) {
      continue;
    }

    const isDouble =
      selectedDoubleId === matchId;

    const payload = {

      action: "submitPrediction",

      playerId: playerId,

      playerName: playerName,

      favoriteTeam: favoriteTeam,

      matchId: matchId,

      homeTeam: match.homeTeam,

      awayTeam: match.awayTeam,

      predictedHome: Number(homeInput.value),

      predictedAway: Number(awayInput.value),

      isDouble: isDouble

    };

    try {

      /*
        التعديل المهم:
        إرسال action=submitPrediction في الرابط
      */

    const response = await fetch(
  API_URL,
  {
    method: "POST",

    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },

    body: JSON.stringify(payload)
  }
);

      const result = await response.json();

      console.log("PREDICTION RESULT:", result);

      if (result.success) {

        savedCount++;

      } else {

        errors.push(
          result.message || "حدث خطأ أثناء الحفظ"
        );

      }

    } catch (error) {

      console.error("SUBMIT ERROR:", error);

      errors.push("تعذر الاتصال بالسيرفر");

    }

  }

  saveButton.disabled = false;

  saveButton.textContent = "💾 حفظ كل التوقعات";

  if (savedCount > 0) {

    showMessage(
      `✅ تم حفظ ${savedCount} توقع بنجاح`,
      true
    );

  } else {

    showMessage(
      errors.length
        ? "❌ " + errors[0]
        : "⚠️ لم يتم حفظ أي توقع",
      false
    );

  }

}


/* =====================================================
   LOAD LEADERBOARD
===================================================== */

async function loadLeaderboard() {

  const container =
    document.getElementById("leaderboardContainer");

  container.innerHTML =
    '<div class="loading">جاري تحميل الترتيب...</div>';

  try {

    const response = await fetch(
      `${API_URL}?action=leaderboard&t=${Date.now()}`,
      {
        method: "GET",
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error("HTTP Error: " + response.status);
    }

    const data = await response.json();

    if (!data.success && !Array.isArray(data.leaderboard)) {
      throw new Error(data.message || "فشل تحميل الترتيب");
    }

    renderLeaderboard(data.leaderboard || []);

  } catch (error) {

    console.error("LEADERBOARD ERROR:", error);

    container.innerHTML =
      "<p>❌ تعذر تحميل الترتيب</p>";

  }

}


/* =====================================================
   RENDER LEADERBOARD
===================================================== */

function renderLeaderboard(players) {

  const container =
    document.getElementById("leaderboardContainer");

  if (!players.length) {

    container.innerHTML = `
      <div class="no-matches">
        لا يوجد ترتيب حاليًا
      </div>
    `;

    return;
  }

  let html = `

    <table>

      <thead>

        <tr>

          <th>المركز</th>
          <th>اللاعب</th>
          <th>الفريق المفضل</th>
          <th>النقاط</th>
          <th>المباريات</th>
          <th>Exact</th>

        </tr>

      </thead>

      <tbody>

  `;

  players.forEach(player => {

    const rank = Number(player.rank);

    const firstClass =
      rank === 1 ? "first-place" : "";

    html += `

      <tr>

        <td class="${firstClass}">
          ${rank === 1 ? "🥇" : rank}
        </td>

        <td>
          ${escapeHtml(player.playerName)}
        </td>

        <td>
          ${escapeHtml(player.favoriteTeam || "-")}
        </td>

        <td>
          <strong>
            ${Number(player.totalPoints || 0)}
          </strong>
        </td>

        <td>
          ${Number(player.playedMatches || 0)}
        </td>

        <td>
          ${Number(player.exactMatches || 0)}
        </td>

      </tr>

    `;

  });

  html += `

      </tbody>

    </table>

  `;

  container.innerHTML = html;
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text, success) {

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.className =
    "message " + (success ? "success" : "error");

  message.style.display = "block";

  setTimeout(() => {

    message.style.display = "none";

  }, 5000);

}


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

  localStorage.removeItem("userType");

  localStorage.removeItem("playerName");

  localStorage.removeItem("favoriteTeam");

  localStorage.removeItem("playerId");

  window.location.href = "login.html";

}


/* =====================================================
   START
===================================================== */

loadMatches();

loadLeaderboard();

setInterval(loadMatches, 60000);

setInterval(loadLeaderboard, 10000);

</script>

</body>
</html>
