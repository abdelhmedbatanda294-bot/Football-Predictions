========================= */

async function loadMatches() {

  try {

    const response =
      await fetch(
        `${API_URL}?action=matches`
      );

    const data =
      await response.json();

    matches =
      data.matches || [];

    renderMatches();

  } catch (error) {

    console.error(error);

    showMessage(
      "حدث خطأ أثناء تحميل المباريات",
      false
    );

  }

}

========================= */

function renderMatches() {

  const container =
    document.getElementById(
      "matchesContainer"
    );


  if (matches.length === 0) {

    container.innerHTML =
      "<p>لا توجد مباريات حاليًا</p>";

    return;

  }


  container.innerHTML = "";


  matches.forEach(match => {

    const matchElement =
      document.createElement("div");


    matchElement.className =
      "match";


    matchElement.innerHTML = `

      <div class="teams">

        <div class="team">

          </label>

          <input
            type="number"
            min="0"
            id="home-${match.matchId}"
            placeholder="0"
          >

        </div>


        <div>

          <label>
            أهداف ${escapeHtml(match.awayTeam)}
          </label>

          <input
            type="number"
            min="0"
            id="away-${match.matchId}"
            placeholder="0"
          >

        </div>

      </div>


      <label class="double-box">

        <input
          type="checkbox"
          id="double-${match.matchId}"
        >

        مباراة Double

      </label>

    `;


    container.appendChild(
      matchElement
    );

  });

}


/* =========================

========================= */

async function submitAllPredictions() {

  const playerName =
    document
      .getElementById(
        "playerName"
      )
      .value
      .trim();


  const favoriteTeam =
    document
      .getElementById(
        "favoriteTeam"
      )

      .trim();

      "اكتب اسمك أولًا",
      false
    );

    return;

  }


  localStorage.setItem(
    "playerName",
    playerName
  );


  localStorage.setItem(
    "favoriteTeam",
    favoriteTeam
  );


  let playerId =
    localStorage.getItem(
      "playerId"
    );


  if (!playerId) {

    playerId =
      playerName
        .toLowerCase()
        .replace(/\s+/g, "-") +
      "-" +
      Date.now();


    localStorage.setItem(
      "playerId",
      playerId
    );

  }


  let savedCount = 0;


  for (
    const match of matches
  ) {

    const homeInput =
      document.getElementById(
        `home-${match.matchId}`
      );

        playerId,

      playerName:
        playerName,

      favoriteTeam:
        favoriteTeam,

      matchId:
        match.matchId,

      homeTeam:
        match.homeTeam,

      awayTeam:
        match.awayTeam,

      predictedHome:
        Number(
          homeInput.value
        ),

      predictedAway:
        Number(
          awayInput.value
        ),

      isDouble:
        doubleInput.checked

    };


    try {

      const response =
        await fetch(
          API_URL,
          {
            method: "POST",
            body:
              JSON.stringify(
                payload
              )
          }
        );


      const result =
        await response.json();


      if (result.success) {

        savedCount++;

      }

    } catch (error) {

      console.error(error);

    }

  }


  showMessage(

    `تم حفظ ${savedCount} توقع بنجاح`,

    savedCount > 0

  );

}
